[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cafe458-backend"
version = "0.1.0"
description = "Backend for Cafe 458 ordering and shop management"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "sqlalchemy[asyncio]>=2.0.40,<3.0",
    "asyncpg>=0.30,<1.0",
    "pydantic-settings>=2.7,<3.0",
    "alembic>=1.14,<2.0",
    "bcrypt>=4.2,<6.0",
    "PyJWT[crypto]>=2.10,<3.0",
    "httpx>=0.28.1",
    "qrcode[pil]>=8.2",
    "python-multipart>=0.0.33",
]

[tool.uv]
package = true

[tool.setuptools.packages.find]
where = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
